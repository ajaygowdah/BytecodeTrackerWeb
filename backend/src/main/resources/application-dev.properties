spring.datasource.url=jdbc:h2:mem:bytecodetracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Override MySQL dialect from base application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Do NOT run schema.sql (contains MySQL-specific ENUM syntax); let Hibernate DDL handle schema
spring.sql.init.mode=never

server.port=8080
app.cors-origin=http://localhost:3000
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
