spring.application.name=bytecodetracker-backend
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bytecodetracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT_SECRET is loaded from .env by BytecodeTrackerApplication before Spring starts.
# The fallback MUST exactly match the .env value so tokens stay valid across restarts.
app.jwt.secret=${JWT_SECRET:replace_with_a_long_random_secret_of_32_chars_or_more}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
